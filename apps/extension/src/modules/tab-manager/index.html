<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity · Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tab-manager.css" />
</head>
<body>
  <main class="tm tm--board">
    <header class="tm__header">
      <button class="tm__back" id="btn-close" type="button" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <div class="tm__titles">
        <div class="tm__eyebrow">Clarity</div>
        <h1 class="tm__title">Workspace</h1>
      </div>
      <div class="tm__toggle">
        <span class="tm__toggle-label" id="toggle-label">On</span>
        <button class="tm__switch" id="btn-toggle" type="button" role="switch" aria-checked="true" aria-label="Toggle Tab Manager">
          <span class="tm__switch-knob"></span>
        </button>
      </div>
    </header>

    <div class="tm__disabled" id="disabled-state">
      <h2>Module off</h2>
      <p>Turn Tab Manager on to group and park tabs.</p>
      <button class="tm__chip tm__chip--primary" id="btn-enable" type="button">Enable module</button>
    </div>

    <div class="tm__body" id="main-body">
      <section class="tm__hero">
        <div class="tm__count" id="open-count">0<span>this window</span></div>
        <p class="tm__subtitle" id="status-line">Choose how to group, then apply to Chrome.</p>
        <div class="tm__scope" role="tablist" aria-label="Window scope">
          <button class="tm__scope-btn is-active" id="scope-current" type="button" data-scope="current">This window</button>
          <button class="tm__scope-btn" id="scope-all" type="button" data-scope="all">All windows</button>
        </div>
        <label class="tm__search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="M20 20l-3.5-3.5" />
          </svg>
          <input id="search" type="search" placeholder="Search tabs…" autocomplete="off" />
        </label>
      </section>

      <div class="tm__groupby">
        <span class="tm__groupby-label">Group by</span>
        <div class="tm__groupby-pills" role="tablist" aria-label="Group by">
          <button type="button" class="tm__groupby-btn is-active" data-groupby="time">Time</button>
          <button type="button" class="tm__groupby-btn" data-groupby="custom">Custom</button>
          <button type="button" class="tm__groupby-btn" data-groupby="theme">Theme</button>
          <button type="button" class="tm__groupby-btn" data-groupby="site">Site</button>
          <button type="button" class="tm__groupby-btn" data-groupby="window">Window</button>
        </div>
        <p class="tm__groupby-hint" id="groupby-hint">Time uses last touch (1h / 6h)</p>
      </div>

      <div class="tm__board-actions">
        <button class="tm__chip tm__chip--primary" id="btn-apply-groups" type="button">Apply as Chrome groups</button>
        <button class="tm__chip" id="btn-new-group" type="button" hidden>New group</button>
        <button class="tm__chip" id="btn-clear-groups" type="button">Clear Clarity groups</button>
        <button class="tm__chip" id="btn-park-idle-main" type="button">Park idle</button>
        <button class="tm__chip" id="btn-close-dupes" type="button">Close duplicates</button>
        <button class="tm__chip" id="btn-restore" type="button">Restore parked</button>
        <button class="tm__chip" id="btn-undo" type="button" hidden>Undo last park</button>
      </div>

      <div class="tm__nudge" id="idle-nudge" hidden>
        <div class="tm__nudge-text" id="idle-nudge-text">Idle tabs ready to park</div>
        <button class="tm__chip tm__chip--primary" id="btn-park-idle" type="button">Park idle</button>
      </div>

      <div class="tm__board" id="board"></div>

      <details class="tm__more">
        <summary>More actions</summary>
        <div class="tm__actions tm__actions--more">
          <button class="tm__chip" id="btn-park-others" type="button">Park all except current</button>
          <label class="tm__setting">
            <input type="checkbox" id="auto-dupes" checked />
            <span>Auto-close exact duplicates when opening this page</span>
          </label>
        </div>
        <section class="tm__section" id="parked-section">
          <div class="tm__section-head">
            <h2 class="tm__section-title">Parked</h2>
            <span class="tm__section-meta" id="parked-meta">0</span>
          </div>
          <div id="parked-list"></div>
        </section>
      </details>
    </div>
  </main>

  <div class="tm__toast" id="toast" role="status">
    <span id="toast-text"></span>
    <button type="button" id="toast-undo" hidden>Undo</button>
  </div>
  <script type="module" src="tab-manager.js"></script>
</body>
</html>
