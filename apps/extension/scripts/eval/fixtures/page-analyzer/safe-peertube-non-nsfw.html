<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta property="og:platform" content="PeerTube">
  <title>Open Science Videos | PeerTube</title>
  <meta name="description" content="Public research talks and conference recordings.">
  <script>
    window.PeerTubeServerConfig = {
      "instance": {
        "name": "OpenSciencePT",
        "shortDescription": "Research talks",
        "isNSFW": false,
        "defaultNSFWPolicy": "do_not_list",
        "broadcastMessage": "Welcome"
      }
    };
  </script>
</head>
<body>
  <div class="peertube-container">
    <my-app ng-version="15.0.0">
      <a href="/w/science-talk">watch</a>
      <p>Conference keynote on climate models.</p>
    </my-app>
  </div>
</body>
</html>
