<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarity — Reset password</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 360px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 1.25rem; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; }
    button { background: #7dd3c0; border: none; font-weight: 600; cursor: pointer; border-radius: 8px; }
    .msg { font-size: 0.9rem; margin-top: 12px; }
    .err { color: #c00; }
    .ok { color: #060; }
  </style>
</head>
<body>
  <h1>Clarity — new password</h1>
  <p id="status" class="msg">Checking link…</p>
  <form id="form" hidden>
    <input type="password" id="password" placeholder="New password (min 6)" minlength="6" required />
    <button type="submit">Update password</button>
  </form>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    const SUPABASE_URL = 'https://yvftumjlqjddrduueneb.supabase.co'
    const SUPABASE_ANON_KEY = 'sb_publishable_Tu3pL-oMVf9Dl7gtipXc9w_LZM2HyoN'
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

    const status = document.getElementById('status')
    const form = document.getElementById('form')

    async function init() {
      const hash = window.location.hash.startsWith('#')
        ? new URLSearchParams(window.location.hash.slice(1))
        : new URLSearchParams()
      const query = new URLSearchParams(window.location.search)
      const access_token = hash.get('access_token') || query.get('access_token')
      const refresh_token = hash.get('refresh_token') || query.get('refresh_token')
      const type = hash.get('type') || query.get('type')

      if (!access_token || type !== 'recovery') {
        status.textContent = 'Invalid or expired link. Request a new reset from the Clarity app.'
        status.className = 'msg err'
        return
      }

      const { error } = await supabase.auth.setSession({ access_token, refresh_token: refresh_token || '' })
      if (error) {
        status.textContent = error.message
        status.className = 'msg err'
        return
      }

      status.textContent = 'Choose a new password, then sign in to the Clarity app.'
      status.className = 'msg ok'
      form.hidden = false
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const password = document.getElementById('password').value
      const { error } = await supabase.auth.updateUser({ password })
      if (error) {
        status.textContent = error.message
        status.className = 'msg err'
        return
      }
      status.textContent = 'Password updated. Open Clarity and log in with your new password.'
      status.className = 'msg ok'
      form.hidden = true
    })

    init()
  </script>
</body>
</html>
